<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedro Páramo</title>
<style>
:root{--bg:#0b0907;--fg:#e8dcc4;--dim:#9c8f78;--accent:#c9a46a;--panel:rgba(12,9,6,.92);--line:#3a2f22;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0907;--fg:#e8dcc4;--dim:#9c8f78;--accent:#c9a46a;--panel:rgba(12,9,6,.92);--line:#3a2f22}}
:root[data-theme="dark"]{--bg:#0b0907;--fg:#e8dcc4;--dim:#9c8f78;--accent:#c9a46a;--panel:rgba(12,9,6,.92);--line:#3a2f22}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:Georgia,"Times New Roman",serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;aspect-ratio:4/3;width:min(100vw,133.333vh);max-height:100vh}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
#title{flex-direction:column;background:radial-gradient(ellipse at center,#2a2016 0%,#0b0907 75%);text-align:center}
#title h1{font-weight:normal;letter-spacing:.35em;font-size:clamp(28px,6vw,56px);margin:0 0 .2em;color:#f1e4c8}
#title p{color:var(--dim);margin:.3em 0;font-size:clamp(12px,1.8vw,16px);max-width:36em}
#title .keys{margin:1.4em 0;font-size:clamp(11px,1.6vw,14px);line-height:1.8;color:var(--fg)}
button{font-family:inherit;background:transparent;color:var(--fg);border:1px solid var(--accent);padding:.6em 1.6em;font-size:clamp(13px,1.8vw,16px);letter-spacing:.15em;cursor:pointer}
button:hover{background:rgba(201,164,106,.15)}
#sub{position:absolute;left:6%;right:6%;bottom:6%;text-align:center;font-size:clamp(12px,2.2vw,19px);text-shadow:0 0 4px #000,0 0 8px #000;pointer-events:none;line-height:1.35}
#sub b{color:var(--accent);font-weight:normal;font-style:italic}
#listen{position:absolute;left:10%;right:10%;top:38%;text-align:center;font-size:clamp(12px,2.2vw,19px);font-style:italic;color:#f4ecdc;text-shadow:0 0 6px #000,0 0 12px #000;pointer-events:none}
#ecoHud{position:absolute;right:3%;top:3%;display:flex;gap:6px;opacity:0;transition:opacity .8s;pointer-events:none}
#ecoHud.on{opacity:.9}
#ecoHud span{width:9px;height:18px;border-radius:5px 5px 2px 2px;border:1px solid rgba(241,228,200,.7)}
#ecoHud span.f{background:rgba(241,228,200,.85)}
#card p{font-size:clamp(14px,2.3vw,20px);line-height:1.55;font-style:italic}
#title .ver{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:var(--dim);font-size:11px;letter-spacing:.1em}
#hint{position:absolute;left:3%;top:3%;font-size:clamp(10px,1.5vw,13px);color:#f1e4c8;text-shadow:0 0 4px #000;pointer-events:none;opacity:.85}
.panel{background:var(--panel);border:1px solid var(--line);padding:clamp(14px,3vw,28px);max-width:640px;width:100%;max-height:100%;overflow:auto}
.panel h2{font-weight:normal;letter-spacing:.2em;margin:0 0 .8em;color:var(--accent);font-size:clamp(15px,2.4vw,22px)}
.frag{border-top:1px solid var(--line);padding:.6em 0;font-size:clamp(12px,1.8vw,15px)}
.frag i{color:var(--dim)}
.frag em{display:block;color:var(--accent);font-style:normal;font-size:.85em;letter-spacing:.08em}
.card{display:block;width:100%;text-align:left;margin:.45em 0;border-color:var(--line);letter-spacing:0;font-size:clamp(12px,1.8vw,15px);padding:.7em 1em}
.card.sel{border-color:var(--accent);background:rgba(201,164,106,.18)}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:1em;flex-wrap:wrap}
.small{color:var(--dim);font-size:clamp(11px,1.5vw,13px)}
.langs{display:flex;gap:8px;margin:0 0 1.2em}
.langs button{padding:.35em .9em;letter-spacing:.1em;border-color:var(--line)}
.langs button.sel{border-color:var(--accent);background:rgba(201,164,106,.18)}
[hidden]{display:none!important}
button.ghost{border-color:var(--line);margin-top:10px;font-size:clamp(11px,1.5vw,13px)}
.mlist{margin-top:10px;max-width:420px;width:100%}
.mlist button{text-align:left;letter-spacing:0;font-size:clamp(11px,1.6vw,14px);padding:.45em 1em;border-color:var(--line)}
.mcol{display:flex;flex-direction:column;gap:10px}
.mcol label,.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:clamp(12px,1.8vw,15px)}
.mrow .langs{margin:0}
input[type=range]{accent-color:var(--accent);flex:1;min-width:0;max-width:60%}
#end{flex-direction:column;background:rgba(0,0,0,.88);text-align:center}
#end p{max-width:32em;line-height:1.6;font-size:clamp(13px,2vw,18px)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="c" width="640" height="480"></canvas>
<div id="hint"></div>
<div id="ecoHud"><span></span><span></span><span></span><span></span><span></span></div>
<div id="card" class="ov"><div class="panel"><h2 id="cardTitle"></h2><p id="cardText"></p><div class="row"><span class="small" data-i18n="cardHint"></span></div></div></div>
<div id="listen"></div>
<div id="sub"></div>
<div id="title" class="ov on">
<h1>PEDRO PÁRAMO</h1>

</div>

<div id="mMain" class="mcol"><button id="mResume" data-i18n="resume"></button><button id="mOpt" data-i18n="options"></button><button id="mCtl" data-i18n="controls"></button><button id="mMom" data-i18n="moments"></button><button id="mQuit" data-i18n="quit"></button></div>
<div id="mOptions" class="mcol" hidden><label for="optVol"><span data-i18n="volume"></span><input id="optVol" type="range" min="0" max="100" value="90"></label><label for="optSens"><span data-i18n="sens"></span><input id="optSens" type="range" min="20" max="300" value="100"></label><div class="mrow"><span data-i18n="language"></span><div class="langs"><button data-lang="es">ES</button><button data-lang="ca">CA</button><button data-lang="en">EN</button></div></div><button class="mBack" data-i18n="back"></button></div>
<div id="mMoments" class="mcol" hidden><div id="mMomList" class="mcol mlist"></div><button class="mBack" data-i18n="back"></button></div>
<div id="mControls" class="mcol" hidden><p class="small" data-i18n="keys"></p><button class="mBack" data-i18n="back"></button></div>
</div></div>
<div id="end" class="ov"><p id="endText"></p><button id="again" data-i18n="again"></button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const VERSION='0.7.0';

const $=id=>document.getElementById(id);

const renderer=new THREE.WebGLRenderer({canvas,antialias:false});

c=floor(c*31.0+b4(gl_FragCoord.xy)*0.7+0.15)/31.0;
c*=1.0-fade;gl_FragColor=vec4(c,1.0);}`,

const postScene=new THREE.Scene();
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));

let seed=1234;
const rng=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const snap=s=>{s.vertexShader=s.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\ngl_Position.xy=floor(gl_Position.xy/gl_Position.w*vec2(320.0,240.0)+0.5)/vec2(320.0,240.0)*gl_Position.w;')};

function bas(color,o={}){const m=new THREE.MeshBasicMaterial(Object.assign({color},o));m.onBeforeCompile=snap;return m}
function mesh(geo,mat,x,y,z,parent){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);(parent||scene).add(m);return m}
function box(w,h,d,mat,x,y,z,parent){return mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,parent)}
function noiseTex(base,vari,cr){const N=128,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=base+(rng()-0.5)*vari;g.fillStyle=`rgb(${v|0},${v|0},${v|0})`;g.fillRect(x,y,1,1)}
for(let i=0;i<14;i++){const x=rng()*N,y=rng()*N,r=8+rng()*30,gr=g.createRadialGradient(x,y,0,x,y,r);const d=rng()>0.5;gr.addColorStop(0,d?'rgba(50,44,40,.28)':'rgba(240,236,228,.22)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
for(let i=0;i<cr*3;i++){g.fillStyle=`rgba(40,34,30,${0.12+rng()*0.22})`;g.fillRect(rng()*N,0,1+rng()*3,20+rng()*80)}
g.strokeStyle='rgba(60,60,60,.55)';for(let i=0;i<cr*1.5;i++){g.beginPath();let x=rng()*N,y=rng()*N;g.moveTo(x,y);for(let k=0;k<6;k++){x+=(rng()-0.5)*20;y+=rng()*14;g.lineTo(x,y)}g.stroke()}
const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.LinearMipmapLinearFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const adobeTex=noiseTex(215,26,6);

const PRESENT={bg:0xbab6c0,fog:0xbdb9c4,near:2,far:15,hs:0xdcd8e4,hg:0x4a4a54,hi:1.05,sc:0xe0dce8,si:0.4,wall:0x8e8a84,wall2:0x7e7a76};
const PAST={bg:0x05060d,fog:0x0b0c18,near:3,far:17,hs:0x34447a,hg:0x2a0606,hi:0.55,sc:0x6070b0,si:0.35,wall:0xe6e0d4,wall2:0xd8d0c2};
scene.background=new THREE.Color(PRESENT.bg);
scene.fog=new THREE.Fog(PRESENT.fog,PRESENT.near,PRESENT.far);
const hemi=new THREE.HemisphereLight(PRESENT.hs,PRESENT.hg,PRESENT.hi);scene.add(hemi);
const sun=new THREE.DirectionalLight(PRESENT.sc,PRESENT.si);sun.position.set(20,40,10);scene.add(sun);
const sunDisc=mesh(new THREE.CircleGeometry(3.2,8),new THREE.MeshBasicMaterial({color:0xffffff,fog:false}),0,0,0);
const wallMat=lam(PRESENT.wall,{map:adobeTex});
const wallMat2=lam(PRESENT.wall2,{map:adobeTex});
const darkMat=lam(0x2a1d14);
const woodMat=lam(0x6b4a2e);
const tileMat=lam(0x8a4a30);
const stoneMat=lam(0x8c8070,{map:adobeTex});

function groundH(x,z){let h=0;if(z>-55)h=Math.min(17,(z+55)*0.17);const ax=Math.abs(x);
if(z>-57){const e=Math.max(0,ax-5);h+=e*e*0.13}else{const e=Math.max(0,ax-22);h+=e*0.7}
if(z<-136)h+=(-136-z)*0.5;return h}
{const tg=new THREE.PlaneGeometry(150,240,60,96);tg.rotateX(-Math.PI/2);tg.translate(0,0,-50);
const p=tg.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);const ax=Math.abs(x);
let y=groundH(x,z);if((z>-57&&ax>6)||(z<=-57&&ax>21))y+=(rng()-0.5)*0.9;p.setY(i,y)}
const g=tg.toNonIndexed();g.computeVertexNormals();const pp=g.attributes.position;const col=[];
for(let i=0;i<pp.count;i+=3){const x=(pp.getX(i)+pp.getX(i+1)+pp.getX(i+2))/3,z=(pp.getZ(i)+pp.getZ(i+1)+pp.getZ(i+2))/3;const ax=Math.abs(x);
let c=rng()>0.6?[0.4,0.47,0.45]:[0.45,0.49,0.53];if((z>-55&&ax<3.2)||(z<=-55&&z>-98&&ax<4.5)||(z<=-98&&z>-136&&ax<17))c=[0.54,0.6,0.66];
const v=0.88+rng()*0.2;for(let k=0;k<3;k++)col.push(c[0]*v,c[1]*v,c[2]*v)}
g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
const groundTex=canvasTex(128,128,gc=>{speck(gc,128,128,[112,120,128],20);for(let i=0;i<26;i++){const x=rng()*128,y=rng()*128,r=6+rng()*26,gr=gc.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rng()>0.5?'rgba(30,40,46,.3)':'rgba(200,206,214,.18)');gr.addColorStop(1,'rgba(0,0,0,0)');gc.fillStyle=gr;gc.fillRect(x-r,y-r,r*2,r*2)}for(let i=0;i<220;i++){gc.fillStyle=rng()>0.5?'rgba(30,36,44,.35)':'rgba(220,224,230,.25)';gc.fillRect(rng()*128|0,rng()*128|0,1,1)}});groundTex.minFilter=THREE.LinearMipmapLinearFilter;groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping;
const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*60,uv.getY(i)*96);
mesh(g,lam(0xffffff,{vertexColors:true,map:groundTex}),0,0,0)}

const colliders=[];
function addCol(x0,x1,z0,z1){colliders.push([Math.min(x0,x1),Math.max(x0,x1),Math.min(z0,z1),Math.max(z0,z1)])}
const pastRoofs=[],pastOnly=[],presentOnly=[];
const plankTex=canvasTex(32,64,g=>{speck(g,32,64,[104,80,58],18);g.fillStyle='rgba(30,20,12,.7)';for(let x=0;x<32;x+=6)g.fillRect(x,0,1,64);g.fillStyle='rgba(30,20,12,.35)';for(let i=0;i<14;i++)g.fillRect(rng()*32|0,rng()*64|0,1,3+rng()*8|0);g.fillRect(0,10,32,2);g.fillRect(0,52,32,2)});
const brickTex=canvasTex(32,32,g=>{g.fillStyle='#5a4a40';g.fillRect(0,0,32,32);for(let y=0;y<32;y+=4)for(let x=(y%8?0:-4);x<32;x+=8){const v=120+rng()*40|0;g.fillStyle=`rgb(${v},${v*0.6|0},${v*0.45|0})`;g.fillRect(x+1,y+1,6,2)}});
const tileTex=canvasTex(32,16,g=>{speck(g,32,16,[128,70,50],22);g.fillStyle='rgba(40,20,14,.6)';for(let x=0;x<32;x+=4)g.fillRect(x,0,1,16)});
const sarapeTex=canvasTex(16,32,g=>{const c=['#7a2a24','#c8a050','#2a3a5a','#e0d8c8','#4a6a3a'];for(let y=0;y<32;y++){g.fillStyle=c[(y>>1)%5];g.fillRect(0,y,16,1)}});
const rugTex=canvasTex(32,32,g=>{speck(g,32,32,[110,40,34],20);g.strokeStyle='rgba(220,200,160,.6)';g.strokeRect(3,3,26,26);g.strokeRect(8,8,16,16)});
const plankMat=lam(0xffffff,{map:plankTex}),darkWood=lam(0x3a2a1c),ironMat=lam(0x26262a),clayMat=lam(0x9a5a3a,{side:THREE.DoubleSide}),brickMat=lam(0xffffff,{map:brickTex}),eaveMat=lam(0xffffff,{map:tileTex}),zocaloMat=lam(0x4a4440,{map:adobeTex});
function rotY(m,a){m.rotation.y=a;return m}
function door(fx,z,s,ajar){box(0.14,2.35,0.14,darkWood,fx+s*0.05,1.17,z-0.68);box(0.14,2.35,0.14,darkWood,fx+s*0.05,1.17,z+0.68);box(0.18,0.16,1.6,darkWood,fx+s*0.07,2.38,z);
box(0.04,2.2,1.24,darkMat,fx+s*0.01,1.1,z);
const pv=new THREE.Group();pv.position.set(fx+s*0.03,0,z-0.6);scene.add(pv);box(0.06,2.18,1.2,plankMat,0,1.09,0.6,pv);box(0.08,0.06,0.06,ironMat,s*0.04,1.05,1.05,pv);pv.rotation.y=ajar?-s*0.9:0;
box(0.55,0.14,1.7,stoneMat,fx+s*0.27,0.07,z)}
function win(fx,z,s,y){y=y||1.75;box(0.04,0.95,0.85,darkMat,fx+s*0.01,y,z);box(0.22,0.08,1.05,darkWood,fx+s*0.1,y-0.52,z);box(0.14,0.08,1.0,darkWood,fx+s*0.06,y+0.52,z);
for(let k=-1.5;k<=1.5;k++)cyl(0.014,0.014,0.95,ironMat,fx+s*0.08,y,z+k*0.19,null,4);box(0.02,0.02,0.85,ironMat,fx+s*0.08,y+0.2,z);
if(rng()>0.5){const sh=box(0.04,0.95,0.42,plankMat,fx+s*0.22,y,z+0.6);sh.rotation.y=s*0.7}}
function house(x0,x1,z0,z1,h,roof,face,mat){const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
const m=box(w,h,d,mat||wallMat,cx,h/2,cz);m.geometry.attributes.uv.array.forEach((v,i,a)=>a[i]=v*2);addCol(x0,x1,z0,z1);
const s=face>0?1:-1,fx=face>0?x1:x0;
box(0.05,0.55,d,zocaloMat,fx+s*0.025,0.27,cz);
const dz=cz+(rng()-0.5)*d*0.3;door(fx,dz,s,rng()>0.65);
const wz=cz+(dz>cz?-1:1)*Math.min(d*0.3,2.6);if(d>4.5)win(fx,wz,s);if(d>9)win(fx,cz+(dz>cz?1:-1)*d*0.36,s);
for(let k=0;k<2;k++)if(rng()>0.45){const pz=z0+0.8+rng()*(d-1.6),py=0.8+rng()*(h-1.6),pw=0.6+rng()*1,ph=0.4+rng()*0.7;if(Math.abs(pz-dz)<1)continue;box(0.03,ph,pw,brickMat,fx+s*0.012,py,pz)}
