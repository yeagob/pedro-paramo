fr:{rebozo:{who:'Una mujer',title:'La mujer del rebozo',text:'Aquí ya no queda nadie. Todos se fueron... o se murieron, que viene a ser lo mismo. Las casas se quedaron oyendo.'},
eduviges:{who:'Eduviges Dyada',title:'La noche de bodas',text:'Dolores me pidió que fuera yo en su lugar la noche de su boda. Fui. Pedro Páramo nunca supo con quién había dormido.'},
caballo:{who:'Eduviges Dyada',title:'El caballo',text:'¿Lo oyes? Es el caballo de Miguel Páramo. Corre de ida y vuelta por el camino de la Media Luna, buscando a su dueño.'},
p1:{who:'Una voz',title:'Miguel ensilla',text:'Esa noche Miguel Páramo ensilló su caballo. Iba a Contla, a ver a una muchacha.'},
p2:{who:'Una voz',title:'La cerca',text:'El caballo se espantó frente a la cerca de piedra que su padre había mandado levantar.'},
p3:{who:'Una voz',title:'La caída',text:'Miguel cayó de cabeza. El caballo siguió corriendo, solo, de ida y vuelta por el camino.'},
p4:{who:'Eduviges Dyada',title:'La ventana',text:'Ya tarde, Miguel tocó mi ventana. Dijo que no encontraba el pueblo, que todo era neblina. Le dije que estaba muerto.'}}},

fr:{rebozo:{who:'Una dona',title:'La dona del rebozo',text:'Aquí ja no hi queda ningú. Tots se\'n van anar... o es van morir, que ve a ser el mateix. Les cases es van quedar escoltant.'},
eduviges:{who:'Eduviges Dyada',title:'La nit de noces',text:'La Dolores em va demanar que hi anés jo en el seu lloc la nit de les noces. Hi vaig anar. Pedro Páramo no va saber mai amb qui havia dormit.'},
caballo:{who:'Eduviges Dyada',title:'El cavall',text:'El sents? És el cavall de Miguel Páramo. Corre amunt i avall pel camí de la Media Luna, buscant el seu amo.'},
p1:{who:'Una veu',title:'Miguel ensella',text:'Aquella nit Miguel Páramo va ensellar el cavall. Anava a Contla, a veure una noia.'},
p2:{who:'Una veu',title:'La tanca',text:'El cavall es va espantar davant la tanca de pedra que el seu pare havia fet aixecar.'},
p3:{who:'Una veu',title:'La caiguda',text:'En Miguel va caure de cap. El cavall va continuar corrent, sol, amunt i avall pel camí.'},
p4:{who:'Eduviges Dyada',title:'La finestra',text:'Ja tard, en Miguel va trucar a la meva finestra. Va dir que no trobava el poble, que tot era boira. Li vaig dir que era mort.'}}},

e1:'Come in. I was expecting you: your mother told me you would come. Today.',e2:'I gave you the room at the back. It\'s full of junk; make yourself comfortable as best you can.',hintEcho:'Hold E to listen to your echo',hintListen:'Hold E to listen',water:'Water and shade. Juan breathes.',waterHint:'Water and shade: here you get your breath back',
fr:{rebozo:{who:'A woman',title:'The woman in the rebozo',text:'Nobody is left here. They all went away... or died, which comes to the same thing. The houses stayed behind, listening.'},
eduviges:{who:'Eduviges Dyada',title:'The wedding night',text:'Dolores asked me to go in her place on her wedding night. I went. Pedro Páramo never knew who he had slept with.'},
caballo:{who:'Eduviges Dyada',title:'The horse',text:'Do you hear it? It\'s Miguel Páramo\'s horse. It runs back and forth along the road to the Media Luna, looking for its master.'},
p1:{who:'A voice',title:'Miguel saddles up',text:'That night Miguel Páramo saddled his horse. He was going to Contla, to see a girl.'},
p2:{who:'A voice',title:'The fence',text:'The horse shied at the stone fence his father had ordered built.'},
p3:{who:'A voice',title:'The fall',text:'Miguel fell headfirst. The horse kept running, alone, back and forth along the road.'},
p4:{who:'Eduviges Dyada',title:'The window',text:'Late that night, Miguel knocked on my window. He said he couldn\'t find the town, that everything was fog. I told him he was dead.'}}}};
Object.assign(I18N.es,{horseAside:'¡El caballo! Juan se aparta de un salto.',a4:'Antes que nada, beba agua en el pozo de la plaza, al fondo de la calle. Luego busque a doña Eduviges: la casa de la mano derecha. Dígale que yo lo mandé.',hintMoveRoad:'WASD caminar · ratón mirar',noRun:'Con este calor no puedo correr. Si corro, no llego.',dizzy:'Todo me da vueltas... Si sigo corriendo me voy a caer.',doorWell:'Cerrado. Primero, el pozo de la plaza.',doorWellSay:'Está cerrado. Antes necesito agua y sombra: el pozo de la plaza, al fondo de la calle.',hintEdu:'Acércate a Eduviges y mantén E para escucharla',hintBed:'Ve al cuarto del fondo, junto al catre, y mantén E',moreBreath:'Cada vez que despiertas, el calor pesa menos: tendrás más aliento que antes.',checkTown:'La entrada del pueblo. Si caes, despertarás aquí.',sub:'Prueba de concepto · Capítulos 1 a 5',keys:'WASD caminar · Shift correr · Ratón mirar (clic para capturar)<br>Mantén E para escuchar · Pulsa E para usar o leer · Tab abre el libro<br>Mantén Esc: menú<br>Usa auriculares',
ch3:'Capítulo 3',ch3t:'Miguel Páramo',ch3i:'La Media Luna, la noche del velorio. Juan entra como entran los recuerdos: sin que nadie lo invite.',
ch4:'Capítulo 4',ch4t:'La infancia de Pedro',ch4i:'Llueve. Pedro Páramo todavía es un niño y Comala todavía es verde.',
ch5:'Capítulo 5',ch5t:'La Media Luna',ch5i:'Pedro ya es el dueño de la Media Luna. Ahora juegas con él.',
nPedro:'Pedro Páramo',nRent:'Padre Rentería',nAbuela:'La abuela',nSusana:'Susana',nFulgor:'Fulgor Sedano',

Object.assign(I18N.es.fr,{w1:{who:'Una plañidera',title:'El rosario',text:'Dicen que mató al hermano del padre Rentería. Y que a Ana, la sobrina, la deshonró. Y aquí estamos todas, rezándole.'},
w2:{who:'Otra plañidera',title:'Sin llorar',text:'Míralo. No llora. Pedro Páramo no ha llorado nunca, ni por su propio hijo.'},
pedro:{who:'Pedro Páramo',title:'El ataúd',text:'Estoy comenzando a pagar. Más vale empezar temprano, para terminar pronto.'},
maria:{who:'María Dyada',title:'Por Eduviges',text:'Mi hermana Eduviges se mató, padre, pero era buena. ¿No hay modo de salvarla? Yo no tengo con qué pagar las misas.'},
ana:{who:'Ana',title:'La sobrina',text:'Fue Miguel Páramo, tío. Entró por la ventana. Lo conocí aunque estaba oscuro.'},
renteria:{who:'Padre Rentería',title:'El precio',text:'Son tuyas, Señor. Él puede comprar la salvación. Tú sabrás si ése es el precio. Una por el que murió, una por la que él lastimó, una por el que pagó.'},
pensar:{who:'Pedro Páramo',title:'El excusado',text:'Pensaba en ti, Susana. En las lomas verdes, cuando volábamos papalotes en la época del aire.'},
papalote:{who:'Pedro Páramo',title:'El papalote',text:'El hilo corría entre nuestros dedos hasta que se reventaba, como si lo hubiera trozado el aleteo de algún pájaro.'},
madre:{who:'La madre de Pedro',title:'La puerta',text:'No abras, Pedro. Han matado a tu padre.'},
toribio:{who:'Toribio Aldrete',title:'La cerca',text:'¡Esa cerca no estaba ahí, Pedro Páramo! Esas tierras son mías. Voy a ir a la ley.'},
v1:{who:'Una viuda',title:'La barranca',text:'A mi marido lo hallaron en la barranca, con las manos amarradas. Nadie vio nada.'},
v2:{who:'Una viuda',title:'Los hijos',text:'¿Y ahora quién les da de comer a mis hijos? Pedro Páramo se quedó hasta con las milpas.'},
v3:{who:'Una viuda',title:'El camino',text:'Salió al camino de Contla y no regresó. Dicen que lo estaban esperando.'},
v4:{who:'Una viuda',title:'La maldición',text:'Que Dios te lo cobre, Pedro Páramo. Que te lo cobre con lo que más quieras.'},
v5:{who:'Una viuda',title:'Sin hombres',text:'Ya no quedan hombres en Comala. Nada más nosotras, y el silencio.'}});
I18N.es.ex={e1:['H. M., febrero de 1999','Doy gracias a la Virgen de la Niebla porque, después de un accidente en la carretera, busqué a mi hija por un pueblo donde nevaba fuera de tiempo y las sirenas sonaban sin guerra. La encontré, aunque ya no era del todo ella.'],
e2:['J. V., septiembre de 1999','A San Judas Tadeo, por librarme de un hombre enorme de gabardina que me siguió de calle en calle gritando «estrellas». Salí de la ciudad antes de que la borraran del mapa.'],
e3:['R. H., diciembre de 1999','Al Santo Niño de Atocha, porque pregunté a todo un barrio dónde se juntan los marineros y nadie me supo decir. Mientras tanto aprendí a manejar un montacargas y le di de comer a un gatito.'],
e4:['S. L., 1999','A San Antonio, por una muchacha que me sacó a bailar en un jardín que volaba, aunque yo no sabía bailar. Y por las cartas: las gané todas menos una.'],
e5:['R., agosto de 1999','A San Miguel Arcángel, porque mi señor me arrancó las alas por tenerlas antes que él y me echó a un lago que quemaba. Volví sin quijada, comiendo almas. Pero volví.'],
e6:['R., julio de 1999','A la Virgen de Zapopan, por sacarme de una isla donde un doctor abrió un agujero en el tiempo y los lagartos grandes entraban por las ventanas.'],
e7:['Un soldado sin nombre, agosto de 1999','A Santa Lucía, por callar la voz de mujer que salía de las paredes de la nave. Me llamaba insecto. Decía que me mirara: jadeando, sudando, una criatura de carne y hueso.'],
e8:['El Sin Nombre, diciembre de 1999','Al Señor de la Misericordia. Desperté en una plancha de muertos sin acordarme de mi nombre, con la espalda escrita. Una calavera que hablaba me acompañó. Aprendí qué puede cambiar la naturaleza de un hombre.'],
e9:['S., noviembre de 1999','A la Virgen del Mar, porque de niño me ahogué en una playa y en otro mundo seguí vivo. Allá nadie me conocía. Ni mi madre.'],
fin:['El año de la niebla','A todos los santos de 1999: el año en que llegaron juntos un pueblo con niebla, un hombre de gabardina, un marinero, un muerto sin nombre y un niño ahogado. Comala también está hecha de polígonos que tiemblan. Gracias por escuchar.']};

Object.assign(I18N.ca.fr,{w1:{who:'Una ploranera',title:'El rosari',text:'Diuen que va matar el germà del pare Rentería. I que a l\'Ana, la neboda, la va deshonrar. I aquí som totes, resant per ell.'},
w2:{who:'Una altra ploranera',title:'Sense plorar',text:'Mira\'l. No plora. Pedro Páramo no ha plorat mai, ni pel seu propi fill.'},
pedro:{who:'Pedro Páramo',title:'El taüt',text:'Començo a pagar. Val més començar d\'hora, per acabar aviat.'},
maria:{who:'María Dyada',title:'Per Eduviges',text:'La meva germana Eduviges es va matar, pare, però era bona. No hi ha manera de salvar-la? Jo no tinc amb què pagar les misses.'},
ana:{who:'Ana',title:'La neboda',text:'Va ser Miguel Páramo, oncle. Va entrar per la finestra. El vaig conèixer tot i que era fosc.'},
renteria:{who:'Pare Rentería',title:'El preu',text:'Són teves, Senyor. Ell pot comprar la salvació. Tu sabràs si aquest és el preu. Una pel qui va morir, una per la qui ell va fer mal, una pel qui va pagar.'},
pensar:{who:'Pedro Páramo',title:'La comuna',text:'Pensava en tu, Susana. En els turons verds, quan fèiem volar estels a l\'època del vent.'},
papalote:{who:'Pedro Páramo',title:'L\'estel',text:'El fil corria entre els nostres dits fins que es trencava, com si l\'hagués tallat el batec d\'ales d\'algun ocell.'},
madre:{who:'La mare d\'en Pedro',title:'La porta',text:'No obris, Pedro. Han matat el teu pare.'},
toribio:{who:'Toribio Aldrete',title:'La tanca',text:'Aquesta tanca no hi era, Pedro Páramo! Aquestes terres són meves. Aniré a la llei.'},
v1:{who:'Una vídua',title:'El barranc',text:'El meu marit el van trobar al barranc, amb les mans lligades. Ningú no va veure res.'},
v2:{who:'Una vídua',title:'Els fills',text:'I ara qui donarà de menjar als meus fills? Pedro Páramo s\'ha quedat fins i tot les milpes.'},
v3:{who:'Una vídua',title:'El camí',text:'Va sortir al camí de Contla i no va tornar. Diuen que l\'esperaven.'},
v4:{who:'Una vídua',title:'La maledicció',text:'Que Déu t\'ho faci pagar, Pedro Páramo. Que t\'ho faci pagar amb el que més estimis.'},
v5:{who:'Una vídua',title:'Sense homes',text:'Ja no queden homes a Comala. Només nosaltres, i el silenci.'}});
I18N.ca.ex={e1:['H. M., febrer de 1999','Dono gràcies a la Mare de Déu de la Boira perquè, després d\'un accident a la carretera, vaig buscar la meva filla per un poble on nevava fora de temps i les sirenes sonaven sense guerra. La vaig trobar, tot i que ja no era del tot ella.'],
e2:['J. V., setembre de 1999','A Sant Judes Tadeu, per alliberar-me d\'un home enorme amb gavardina que em va seguir de carrer en carrer cridant «estrelles». Vaig sortir de la ciutat abans que l\'esborressin del mapa.'],
e3:['R. H., desembre de 1999','Al Sant Nen d\'Atocha, perquè vaig preguntar a tot un barri on es reuneixen els mariners i ningú no m\'ho va saber dir. Mentrestant vaig aprendre a conduir un toro i vaig donar menjar a un gatet.'],
e4:['S. L., 1999','A Sant Antoni, per una noia que em va treure a ballar en un jardí que volava, tot i que jo no sabia ballar. I per les cartes: les vaig guanyar totes menys una.'],
e5:['R., agost de 1999','A Sant Miquel Arcàngel, perquè el meu senyor em va arrencar les ales per tenir-les abans que ell i em va llançar a un llac que cremava. Vaig tornar sense mandíbula, menjant ànimes. Però vaig tornar.'],
e6:['R., juliol de 1999','A la Mare de Déu de Zapopan, per treure\'m d\'una illa on un doctor va obrir un forat en el temps i els llangardaixos grossos entraven per les finestres.'],
e7:['Un soldat sense nom, agost de 1999','A Santa Llúcia, per fer callar la veu de dona que sortia de les parets de la nau. Em deia insecte. Deia que em mirés: panteixant, suant, una criatura de carn i os.'],
e8:['El Sense Nom, desembre de 1999','Al Senyor de la Misericòrdia. Em vaig despertar en una llosa de morts sense recordar el meu nom, amb l\'esquena escrita. Una calavera que parlava em va acompanyar. Vaig aprendre què pot canviar la naturalesa d\'un home.'],
e9:['S., novembre de 1999','A la Mare de Déu del Mar, perquè de petit em vaig ofegar en una platja i en un altre món vaig continuar viu. Allà ningú no em coneixia. Ni la meva mare.'],
fin:['L\'any de la boira','A tots els sants de 1999: l\'any en què van arribar alhora un poble amb boira, un home amb gavardina, un mariner, un mort sense nom i un nen ofegat. Comala també està feta de polígons que tremolen. Gràcies per escoltar.']};
Object.assign(I18N.en,{horseAside:'The horse! Juan leaps out of the way.',a4:'First of all, drink some water at the well in the square, at the end of the street. Then look for Doña Eduviges: the house on the right. Tell her I sent you.',hintMoveRoad:'WASD walk · mouse look',noRun:'I can\'t run in this heat. If I run, I won\'t make it.',dizzy:'Everything is spinning... If I keep running I\'ll fall.',doorWell:'Locked. First, the well in the plaza.',doorWellSay:'It\'s locked. I need water and shade first: the well in the plaza, at the end of the street.',hintEdu:'Go up to Eduviges and hold E to listen to her',hintBed:'Go to the back room, by the cot, and hold E',moreBreath:'Each time you wake, the heat weighs less: you will have more breath than before.',checkTown:'The edge of town. If you fall, you will wake here.',sub:'Proof of concept · Chapters 1 to 5',keys:'WASD walk · Shift run · Mouse look (click to capture)<br>Hold E to listen · Press E to use or read · Tab opens the book<br>Hold Esc: menu<br>Wear headphones',

Object.assign(I18N.en.fr,{w1:{who:'A mourner',title:'The rosary',text:'They say he killed Father Rentería\'s brother. And that he dishonored Ana, the niece. And here we all are, praying for him.'},
w2:{who:'Another mourner',title:'No tears',text:'Look at him. He doesn\'t cry. Pedro Páramo has never cried, not even for his own son.'},
pedro:{who:'Pedro Páramo',title:'The coffin',text:'I am beginning to pay. Better to start early, so as to finish soon.'},
maria:{who:'María Dyada',title:'For Eduviges',text:'My sister Eduviges killed herself, Father, but she was good. Is there no way to save her? I have nothing to pay for the masses.'},
ana:{who:'Ana',title:'The niece',text:'It was Miguel Páramo, Uncle. He came in through the window. I knew him even though it was dark.'},
renteria:{who:'Father Rentería',title:'The price',text:'They are yours, Lord. He can buy salvation. You will know if that is the price. One for the one who died, one for the one he hurt, one for the one who paid.'},
pensar:{who:'Pedro Páramo',title:'The outhouse',text:'I was thinking of you, Susana. Of the green hills, when we flew kites in the windy season.'},
papalote:{who:'Pedro Páramo',title:'The kite',text:'The string ran through our fingers until it snapped, as if the beat of some bird\'s wing had cut it.'},
madre:{who:'Pedro\'s mother',title:'The door',text:'Don\'t open it, Pedro. They have killed your father.'},
toribio:{who:'Toribio Aldrete',title:'The fence',text:'That fence wasn\'t there, Pedro Páramo! That land is mine. I\'m going to the law.'},
v1:{who:'A widow',title:'The ravine',text:'They found my husband in the ravine, with his hands tied. Nobody saw anything.'},
v2:{who:'A widow',title:'The children',text:'And now who will feed my children? Pedro Páramo took even the cornfields.'},
v3:{who:'A widow',title:'The road',text:'He went out on the Contla road and never came back. They say someone was waiting for him.'},
v4:{who:'A widow',title:'The curse',text:'May God make you pay, Pedro Páramo. May He make you pay with what you love most.'},
v5:{who:'A widow',title:'No men',text:'There are no men left in Comala. Only us, and the silence.'}});
I18N.en.ex={e1:['H. M., February 1999','I give thanks to the Virgin of the Fog because, after an accident on the highway, I searched for my daughter through a town where it snowed out of season and the sirens wailed with no war. I found her, though she was no longer quite herself.'],
e2:['J. V., September 1999','To Saint Jude, for delivering me from an enormous man in a trench coat who followed me from street to street shouting «stars». I left the city before they wiped it off the map.'],
e3:['R. H., December 1999','To the Holy Child of Atocha, because I asked a whole neighborhood where the sailors hang out and nobody could tell me. Meanwhile I learned to drive a forklift and fed a little kitten.'],
e4:['S. L., 1999','To Saint Anthony, for a girl who asked me to dance in a garden that flew, though I didn\'t know how to dance. And for the cards: I won every game but one.'],
e5:['R., August 1999','To Saint Michael the Archangel, because my lord tore off my wings for having them before he did and cast me into a lake that burned. I came back without a jaw, devouring souls. But I came back.'],
e6:['R., July 1999','To the Virgin of Zapopan, for getting me off an island where a doctor opened a hole in time and the big lizards came in through the windows.'],
e7:['A nameless soldier, August 1999','To Saint Lucy, for silencing the woman\'s voice that came out of the ship\'s walls. She called me an insect. She told me to look at myself: panting, sweating, a creature of meat and bone.'],
e8:['The Nameless One, December 1999','To the Lord of Mercy. I woke on a mortuary slab without remembering my name, my back covered in writing. A talking skull kept me company. I learned what can change the nature of a man.'],
e9:['S., November 1999','To the Virgin of the Sea, because as a boy I drowned on a beach and in another world I went on living. Nobody knew me there. Not even my mother.'],
fin:['The year of the fog','To all the saints of 1999: the year when a foggy town, a man in a trench coat, a sailor, a nameless dead man and a drowned boy all arrived together. Comala, too, is made of trembling polygons. Thank you for listening.']};

Object.assign(I18N.es.fr,{d1:{who:'Damiana Cisneros',title:'De niño',text:'Yo te cuidé cuando eras chiquito, en la Media Luna. Tu madre te dejaba en mis brazos y se iba a llorar al corral.'},
d2:{who:'Damiana Cisneros',title:'Las puertas',text:'Pedro Páramo tocaba de noche la puerta de las criadas. Una por una. Yo nunca le abrí, y por eso todavía me acuerdo de su voz.'},
h1:{who:'La hermana',title:'El obispo',text:'Pasó el obispo por aquí. Le pedimos que nos casara y no quiso. Dijo que éramos hermanos, que lo nuestro era pecado. Desde entonces nadie nos mira.'},
h2:{who:'Donis',title:'El becerro',text:'Voy a buscar un becerro que se me fue. Tú quédate con ella. Si no vuelvo, no me esperes.'},
do1:{who:'Dorotea',title:'El hijo',text:'Me pasé la vida buscando un hijo que nunca tuve. Lo cargaba en el rebozo, Juan, y no había nada en el rebozo.'},
sz1:{who:'Susana San Juan',title:'Bajo tierra',text:'Estoy acostada en la misma cama donde murió mi madre. Afuera llueve. Florencio... ¿dónde estás, Florencio?'},
s0:{who:'Susana San Juan',title:'La calavera',text:'No era oro, papá. Era una calavera. Se me deshizo en las manos, como si estuviera hecha de cal.'},
s1:{who:'Susana San Juan',title:'El mar',text:'El mar moja mis tobillos, luego mis rodillas, mis muslos. Rodea mi cintura con su brazo suave. Me baño desnuda en el mar.'},
s2:{who:'Susana San Juan',title:'Florencio',text:'Florencio era mi marido. No me importa lo que digan: era él quien me abrazaba. Tú no, Pedro Páramo. Tú nunca.'},
pf:{who:'Pedro Páramo',title:'El camino',text:'Había una luna grande en medio del mundo. Hace mucho que te fuiste, Susana. La luz era igual que ahora.'}});

Object.assign(I18N.ca.fr,{d1:{who:'Damiana Cisneros',title:'De petit',text:'Jo et vaig cuidar quan eres petitó, a la Media Luna. La teva mare et deixava als meus braços i se n\'anava a plorar al corral.'},
d2:{who:'Damiana Cisneros',title:'Les portes',text:'Pedro Páramo trucava de nit a la porta de les criades. Una per una. Jo no li vaig obrir mai, i per això encara recordo la seva veu.'},
h1:{who:'La germana',title:'El bisbe',text:'Va passar el bisbe per aquí. Li vam demanar que ens casés i no va voler. Va dir que érem germans, que això nostre era pecat. Des d\'aleshores ningú no ens mira.'},
h2:{who:'Donis',title:'El vedell',text:'Vaig a buscar un vedell que se m\'ha escapat. Tu queda\'t amb ella. Si no torno, no m\'esperis.'},
do1:{who:'Dorotea',title:'El fill',text:'Em vaig passar la vida buscant un fill que mai no vaig tenir. El duia al rebozo, Juan, i no hi havia res al rebozo.'},
sz1:{who:'Susana San Juan',title:'Sota terra',text:'Estic estirada al mateix llit on va morir la meva mare. A fora plou. Florencio... on ets, Florencio?'},
s0:{who:'Susana San Juan',title:'La calavera',text:'No era or, pare. Era una calavera. Se\'m va desfer a les mans, com si fos feta de calç.'},
s1:{who:'Susana San Juan',title:'El mar',text:'El mar em mulla els turmells, després els genolls, les cuixes. M\'envolta la cintura amb el seu braç suau. Em banyo nua al mar.'},
s2:{who:'Susana San Juan',title:'Florencio',text:'En Florencio era el meu marit. No m\'importa el que diguin: era ell qui m\'abraçava. Tu no, Pedro Páramo. Tu mai.'},
pf:{who:'Pedro Páramo',title:'El camí',text:'Hi havia una lluna grossa al mig del món. Fa molt que te\'n vas anar, Susana. La llum era igual que ara.'}});

Object.assign(I18N.en.fr,{d1:{who:'Damiana Cisneros',title:'As a baby',text:'I looked after you when you were tiny, at the Media Luna. Your mother would leave you in my arms and go cry in the corral.'},
d2:{who:'Damiana Cisneros',title:'The doors',text:'Pedro Páramo used to knock at the maids\' doors at night. One by one. I never opened to him, and that\'s why I still remember his voice.'},
h1:{who:'The sister',title:'The bishop',text:'The bishop came through here. We asked him to marry us and he refused. He said we were brother and sister, that what we had was a sin. Since then nobody looks at us.'},
h2:{who:'Donis',title:'The calf',text:'I\'m going to look for a calf that got away. You stay with her. If I don\'t come back, don\'t wait for me.'},
do1:{who:'Dorotea',title:'The son',text:'I spent my life looking for a son I never had. I carried him in my rebozo, Juan, and there was nothing in the rebozo.'},
